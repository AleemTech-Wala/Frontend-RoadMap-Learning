<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox Basics</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 40px;
            background-color: #f5f5f5;
        }

        .example{
            margin-bottom: 40px;
        }
        h2{
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .container-normal{
            background-color: #ecf0f1;
            padding: 20px;
            border: 2px solid #95a5a6;
        }

        .container-flex{
            display: flex;
            background-color: #e8f5e9;
            padding: 20px;
            border: 2px solid #4caf50;
        }

        .box{
            width: 100px;
            height: 100px;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="example">
        <h2>Without Flexbox (normal block)</h2>
        <div class="container-normal">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>
            <p style="margin-top: 10px;color: #7f8c8d;">
                Notice: Boxes are stacked vertically (normal block behavior)
            </p>
    </div>

        <div class="example">
            <h2>With Flexbox</h2>
            <div class="container-flex">
                <div class="box">1</div>
                <div class="box">2</div>
                <div class="box">3</div>
            </div>
                <p style="margin-top: 10px;color: #7f8c8d;">
                     Notice: Boxes are in a row automatically! (flex default behavior)
                </p>
        </div>
</body>
</html>
